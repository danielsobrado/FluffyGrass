<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta
    name="description"
    content="FluffyGrass third-person character test build."
  />
  <meta name="theme-color" content="#9eb8c5" />
  <title>FluffyGrass · Third-Person Character Test</title>
  <link rel="stylesheet" href="./character-demo.css" />
</head>
<body>
  <header class="panel title">
    <strong>FluffyGrass · Snowflow Character</strong>
    <span>Direct gh-pages test build · no GitHub Actions</span>
  </header>
  <pre id="status" class="panel">Loading third-person world…</pre>
  <div class="panel help">
    Desktop: click, mouse look, WASD, Shift run, wheel zoom, F reset ·
    Mobile: left drag move, right drag look, RUN/⌂
  </div>
  <div class="mobile-actions" aria-label="Character controls">
    <button type="button" data-reset aria-label="Reset character">⌂</button>
    <button type="button" data-run aria-label="Run">RUN</button>
  </div>
  <a
    class="repo-link"
    href="https://github.com/danielsobrado/FluffyGrass"
  >GitHub</a>
  <canvas id="canvas"></canvas>
  <script type="module" src="./character-demo.js"></script>
</body>
</html>
