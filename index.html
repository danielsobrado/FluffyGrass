<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta
    name="description"
    content="Drusniel World: continuous dense grass LODs with a visible Drow adventurer and interactive grass physics."
  />
  <meta name="theme-color" content="#312742" />
  <title>Drusniel World · Dense Far Grass</title>
  <link rel="stylesheet" href="./character-demo.css" />
</head>
<body>
  <header class="panel title">
    <strong>Drusniel World</strong>
    <span>Dense single blades · 3× offset mid/far underfill · interactive grass wake</span>
  </header>
  <pre id="status" class="panel">Loading Drusniel World…</pre>
  <div class="panel help">
    Desktop: click, mouse look, WASD, Shift run, wheel zoom, F reset ·
    Mobile: left drag move, right drag look, RUN/⌂
  </div>
  <div class="mobile-actions" aria-label="Character controls">
    <button type="button" data-reset aria-label="Reset character">⌂</button>
    <button type="button" data-run aria-label="Run">RUN</button>
  </div>
  <a
    class="repo-link"
    href="https://github.com/danielsobrado/FluffyGrass"
  >GitHub</a>
  <canvas id="canvas"></canvas>
  <script type="module" src="./scene-capture.js?v=539630f3"></script>
  <script type="module" src="./drusniel-theme.js?v=0e2fb7ec"></script>
  <script type="module" src="./character-demo.js"></script>
  <script type="module" src="./mid-lod-underfill.js?v=d539acf1"></script>
  <script type="module" src="./drow-visibility-fix.js?v=8b6008c0"></script>
</body>
</html>
