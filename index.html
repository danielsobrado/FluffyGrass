<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta
    name="description"
    content="Drusniel World: a large procedural grass world with a third-person Drow adventurer."
  />
  <meta name="theme-color" content="#312742" />
  <title>Drusniel World · v0.8.6-drow</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/character-controls.css" />
</head>
<body>
  <header class="app-title">
    <strong>Drusniel World</strong>
    <span id="scene-mode">Drusniel World · Drow Adventurer</span>
    <span id="build-version">v0.8.6-drow · 2026-08-03</span>
  </header>
  <pre id="world-stats">Loading Drusniel World…</pre>
  <div id="control-help" class="flight-help">
    Desktop: click, mouse orbit, WASD, Shift run, wheel zoom, F reset ·
    Mobile: left drag move, right drag look, RUN/⌂ · Add ?control=fly for flight
  </div>
  <nav>
    <a
      href="https://github.com/danielsobrado/FluffyGrass"
      aria-label="View Drusniel World on GitHub"
    >
      <img src="/github-mark.svg" alt="" />
    </a>
  </nav>
  <canvas id="canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
